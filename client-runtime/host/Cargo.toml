[package]
name = "client-runtime-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "client-runtime-host"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
ciborium = "0.2"
ciborium-io = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
dashmap = "6"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"

# Phase 3 — wasm guest hosting
wasmtime = { version = "44", features = ["component-model", "async", "cranelift", "runtime"] }
wasmtime-wasi = { version = "44", features = ["p2"] }
wasmtime-wasi-http = { version = "44", features = ["p2"] }
hyper = { version = "1", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
