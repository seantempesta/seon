[project]
name = "seon-diffusion"
version = "0.1.0"
description = "The verified canvas — oracle-guided DiffusionGemma generation (MLX-local first) for seon"
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.31.2",
    "transformers>=5.11.0",
    "safetensors",
    "sentencepiece",
    "huggingface-hub",
    "jinja2",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# torch/MPS parity oracle for the MLX model (parity_ref.npz lives outside git)
parity = ["torch>=2.12.1", "accelerate"]
# frozen RunPod CUDA worker (cuda/runpod_worker.py) — revive by need
cuda = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seon_diffusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
