#konserve :local/root version shim (2.2d Stage A)
#
#datahike.tools/get-version resolves dependency versions from
#META-INF/maven/<group>/<artifact>/pom.properties on the classpath.
#The org.replikativ/konserve fork is wired as :local/root (no jar,
#no META-INF), so without this shim the version reads as nil and
#datahike's connector version-check refuses to open any store stamped
#with the previously-deployed 0.9.346 ("written with newer konserve").
#
#0.9.347 = the deployed 0.9.346 + the header fix (konserve repo commit
#32e3c598 on branch sync-only; the connector check is a string compare,
#so any value >= "0.9.346" admits 0.9.346-stamped stores). DELETE this
#shim when the fix ships as a real mvn artifact and the :local/root
#override goes away.
version=0.9.347
groupId=org.replikativ
artifactId=konserve
