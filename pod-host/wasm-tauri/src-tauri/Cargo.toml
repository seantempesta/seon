# seon-tauri — the Seon desktop shell (demo, 2026-06-12) + wasm-era pod lib.
#
# The BINARY (`seon`, src/main.rs) is the Tauri 2 desktop shell: it ensures
# the stack is up via `bin/seon start all`, waits for the pod gate
# (GET /agents → 200), then opens a native window on the mission-control UI
# at http://127.0.0.1:7890. Closing the window leaves the stack running —
# `bin/seon stop` stays a manual terminal act.
#
# The LIB (pod.rs + http.rs) is wasm-era: mcp-server-seon still embeds
# `seon_tauri::pod::Pod` in-process, so it stays until that crate is ported.

[package]
name = "seon-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Seon desktop host (V0.5)"

[lib]
name = "seon_tauri"
path = "src/lib.rs"

[[bin]]
name = "seon"
path = "src/main.rs"

[build-dependencies]
tauri-build        = { workspace = true }

[dependencies]
tauri              = { workspace = true }
wasmtime           = { workspace = true, features = ["component-model", "async", "cranelift", "runtime"] }
wasmtime-wasi      = { workspace = true, features = ["p2"] }
wasmtime-wasi-http = { workspace = true, features = ["p2"] }
# `hyper` is re-exported by wasmtime-wasi-http internally; we depend on it
# directly for the `SeonHttpHooks::send_request` override type signature.
hyper              = { version = "1", default-features = false }
tokio              = { workspace = true }
serde_json         = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }

[dev-dependencies]
tokio            = { workspace = true, features = ["macros", "rt-multi-thread"] }
http-body-util   = "0.1"
bytes            = "1"
http             = "1"

[lints.rust]
unsafe_code = "forbid"
