<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Seon</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #14110d; color: #e8dcc8;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; cursor: default;
  }
  .wrap { text-align: center; }
  .name { font-size: 28px; letter-spacing: 0.35em; color: #ffb000; margin-bottom: 18px; }
  .status { font-size: 12px; color: #9a8c74; }
  .dot { color: #ffb000; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="name">SEON</div>
    <div class="status"><span class="dot">●</span> <span id="status">starting the stack…</span></div>
  </div>
</body>
</html>
