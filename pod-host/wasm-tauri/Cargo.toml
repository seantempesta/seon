# seon pod-host — wasm-tauri Cargo workspace.
#
# Wraps the seon CLJS pod as a wasm32-wasip2 component (via wasm-rquickjs)
# and embeds it inside a Tauri Rust process running wasmtime. Provides the
# WIT-typed capability boundary (fs / http / mcp / capability-prompt) that
# replaces the raw-Node trust model with real containment.
#
# See docs/seon/pod/wasm-spike-2026-05-20.md for the full design.
#
# Members:
#   - src-tauri/         — Tauri desktop host (Rust binary) embedding wasmtime
#   - mcp-server-seon/   — MCP-over-stdio server (Rust binary) that talks to
#                          the running Tauri pod via local IPC.
#
# Build artifacts (gitignored):
#   - pod-build/         — generated by `wasm-rquickjs generate-wrapper-crate`
#   - src-tauri/target/  — Tauri host build outputs
#   - target/            — workspace-level target dir

[workspace]
resolver = "2"
members = [
    "src-tauri",
    "mcp-server-seon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Seon Contributors"]

# Versions pinned 2026-05-19 to latest published on crates.io. Earlier
# planning named wasmtime 46.x / Tauri 2.11.x; wasmtime's main branch
# sits at 46.0.0 but the latest *published* on crates.io is 44.x. We
# follow crates.io. Bump deliberately and document version moves.
[workspace.dependencies]
# Tauri host (default features on: wry webview, config-json codegen)
tauri              = { version = "2.11" }
tauri-build        = { version = "2.6" }

# WASM runtime (wasmtime 44.x = latest crates.io release on 2026-05-19)
wasmtime           = { version = "44" }
wasmtime-wasi      = { version = "44" }
wasmtime-wasi-http = { version = "44" }

# Async runtime
tokio              = { version = "1", features = ["macros", "rt-multi-thread", "sync", "io-util", "net", "process", "time"] }

# Misc
anyhow             = "1"
thiserror          = "2"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Workspace-wide profile defaults: optimize release builds, debug-friendly
# dev builds. Per-crate overrides go in each crate's Cargo.toml.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
