[project]
name = "seon-needle"
version = "0.1.0"
description = "MLX port of the needle 26M encoder-decoder (Simple Attention Network) for seon REPL autosuggest"
requires-python = ">=3.11"
dependencies = [
    "mlx>=0.31",
    "safetensors",
    "sentencepiece",
    "huggingface-hub",
    "numpy",
    "ml-dtypes",
]

[project.optional-dependencies]
# jax/flax are for the parity proof ONLY (reference implementation on CPU,
# imported from reference-code/needle via sys.path — never copied).
test = ["pytest>=8", "jax", "jaxlib", "flax"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seon_needle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
