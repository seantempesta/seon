[project]
name = "seon-clm"
version = "0.1.0"
description = "MLX port of CLM inference (Qwen3-8B last-token encoder + projection heads) for Seon context relevance"
requires-python = ">=3.11"
dependencies = [
    "mlx>=0.29",
    "mlx-lm>=0.28",
    "safetensors",
    "numpy",
    "huggingface-hub",
    "transformers",
    "fastapi",
    "uvicorn",
    "requests",
]

[project.optional-dependencies]
# torch is for the head conversion and the parity proof ONLY (reference
# implementation imported from reference-code/CLM via sys.path — never copied).
test = ["pytest>=8", "torch"]

[project.scripts]
seon-clm-serve = "seon_clm.server:main"
seon-clm-convert = "seon_clm.convert:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seon_clm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
